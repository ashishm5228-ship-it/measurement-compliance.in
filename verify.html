<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Verify Certificate</title><link rel="stylesheet" href="style.css"><style>.box{max-width:600px;margin:60px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 8px 24px #0001}input,button{width:100%;padding:12px;margin-top:10px}button{background:#123b66;color:white;border:0;border-radius:6px}.result{margin-top:20px;padding:15px;background:#eef6ff;border-radius:8px}</style></head><body><div class="box"><h1>Certificate Verification</h1><p>Enter certificate or application number.</p><input id="number" placeholder="Certificate/Application number"><button onclick="verify()">Verify</button><div id="result" class="result"></div><p><a href="1.html">Go back</a></p></div><script>function verify(){const n=document.getElementById('number').value.trim();const apps=JSON.parse(localStorage.getItem('applications')||'[]');const a=apps.find(x=>String(x.applicationNumber||x.certificateNumber||x.id||'').toLowerCase()===n.toLowerCase());document.getElementById('result').textContent=a?'Record found. Status: '+(a.status||'Available'):'No matching certificate/application found.';}</script></body></html>
